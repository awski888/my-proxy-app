<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background: #1e293b; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .address-bar { flex-grow: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .btn { padding: 8px 16px; background: #38bdf8; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; cursor: pointer; }
        .ip-tag { font-size: 12px; color: #38bdf8; padding: 4px 8px; border: 1px solid #38bdf8; border-radius: 12px; }
        iframe { flex-grow: 1; border: none; background: #fff; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="text" id="urlInput" class="address-bar" placeholder="Enter site (e.g. example.com)" onkeydown="if(event.key==='Enter') loadPage()">
        <button class="btn" onclick="loadPage()">Go</button>
        <div class="ip-tag" id="ipDisplay">IP: Loading...</div>
    </div>

    <iframe id="view"></iframe>

    <script>
        async function fetchIP() {
            try {
                const res = await fetch('/api/my-ip');
                const data = await res.json();
                document.getElementById('ipDisplay').innerText = `IP: ${data.ip}`;
            } catch (e) {
                document.getElementById('ipDisplay').innerText = `IP: Error`;
            }
        }

        function loadPage() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            document.getElementById('view').src = `/proxy?url=${encodeURIComponent(url)}`;
        }

        fetchIP();
    </script>
</body>
</html>
