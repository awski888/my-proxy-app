<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Web Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #121826;
            --bg-element: #1b2436;
            --bg-hover: #26334d;
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #222f43;
            --border-active: #38bdf8;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar & Navigation */
        .chrome-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .nav-controls {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--bg-element);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .address-box {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 4px 14px;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .address-box:focus-within {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .protocol-icon {
            color: var(--accent-primary);
            display: flex;
            align-items: center;
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            outline: none;
        }

        .url-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            background: var(--accent-gradient);
            color: #090d16;
            font-weight: 700;
            font-size: 13px;
            padding: 0 20px;
            height: 38px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            opacity: 0.92;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .status-badge {
            background: var(--accent-glow);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-primary);
        }

        /* Progress Bar */
        .progress-container {
            height: 3px;
            width: 100%;
            background: transparent;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        /* Viewport & Speed Dial Overlay */
        .stage {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        .speed-dial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .speed-dial.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 680px;
            width: 100%;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            background: var(--bg-element);
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: var(--bg-element);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <header class="chrome-bar">
        <div class="nav-controls">
            <button class="icon-btn" onclick="historyBack()" title="Back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="icon-btn" onclick="historyForward()" title="Forward">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/></svg>
            </button>
            <button class="icon-btn" onclick="reloadFrame()" title="Reload">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" onclick="goHome()" title="Home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
        </div>

        <div class="address-box">
            <span class="protocol-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="text" id="urlInput" class="url-input" placeholder="Search with DuckDuckGo or enter web address..." onkeydown="handleKeyPress(event)">
        </div>

        <button class="action-btn" onclick="navigate()">Go</button>

        <div class="status-badge">
            <span class="status-dot"></span>
            Protected
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="loader"></div>
    </div>

    <main class="stage">
        <div class="speed-dial" id="speedDial">
            <div class="brand-title">Apex Browser</div>
            <div class="brand-subtitle">Encrypted, anonymous web gateway</div>

            <div class="shortcuts-grid">
                <div class="card" onclick="quickNav('https://html.duckduckgo.com/html/')">
                    <div class="card-icon">🔍</div>
                    <div class="card-title">DuckDuckGo</div>
                </div>
                <div class="card" onclick="quickNav('https://www.wikipedia.org')">
                    <div class="card-icon">📚</div>
                    <div class="card-title">Wikipedia</div>
                </div>
                <div class="card" onclick="quickNav('https://news.ycombinator.com')">
                    <div class="card-icon">⚡</div>
                    <div class="card-title">Hacker News</div>
                </div>
                <div class="card" onclick="quickNav('https://bing.com')">
                    <div class="card-icon">🌐</div>
                    <div class="card-title">Bing</div>
                </div>
            </div>
        </div>

        <iframe id="viewport" src="about:blank" onload="finishLoading()"></iframe>
    </main>

    <script>
        function startLoading() {
            document.getElementById('loader').style.width = '70%';
        }

        function finishLoading() {
            const loader = document.getElementById('loader');
            loader.style.width = '100%';
            setTimeout(() => { loader.style.width = '0%'; }, 300);
        }

        function navigate() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;

            document.getElementById('speedDial').classList.add('hidden');
            startLoading();

            let targetUrl = input;
            if (!input.includes('.') || input.includes(' ')) {
                targetUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(input)}`;
            } else if (!/^https?:\/\//i.test(input)) {
                targetUrl = 'https://' + input;
            }

            document.getElementById('viewport').src = `/proxy?url=${encodeURIComponent(targetUrl)}`;
        }

        function quickNav(url) {
            document.getElementById('urlInput').value = url;
            navigate();
        }

        function goHome() {
            document.getElementById('speedDial').classList.remove('hidden');
            document.getElementById('urlInput').value = '';
            document.getElementById('viewport').src = 'about:blank';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') navigate();
        }

        function reloadFrame() {
            startLoading();
            const frame = document.getElementById('viewport');
            frame.src = frame.src;
        }

        function historyBack() {
            try { document.getElementById('viewport').contentWindow.history.back(); } catch (e) {}
        }

        function historyForward() {
            try { document.getElementById('viewport').contentWindow.history.forward(); } catch (e) {}
        }
    </script>
</body>
</html>
